<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlertaVia</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI'}
body{background:#F1F5F9}
.header{background:#0F172A;color:white;padding:16px 16px 80px 16px}
.header-top{display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:26px;font-weight:800}
.badge-live{background:#16A34A;color:white;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.main{margin-top:-60px;padding:0 14px 90px 14px}
.card{background:white;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.green-card{background:#16A34A;color:white;border-radius:18px 18px 0 0;padding:14px;display:flex;align-items:center;gap:10px}
.green-dot{width:32px;height:32px;background:rgba(255,255,255,.2);border-radius:50%;display:flex;align-items:center;justify-content:center}
.clima-row{display:flex;justify-content:space-between;align-items:center}
.route-map{height:180px;background:#E2E8F0;border-radius:14px;margin:12px 0;position:relative;overflow:hidden;background-image:linear-gradient(90deg,#3B82F6 2px, transparent 2px);background-size:40px}
.route-line{position:absolute;top:50%;left:10%;right:10%;height:4px;background:linear-gradient(90deg,#0EA5E9,#22C55E);border-radius:4px}
.pin{position:absolute;background:white;padding:4px 10px;border-radius:20px;font-weight:700;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.via-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.via-icon{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px}
.via-badge{padding:4px 8px;border-radius:8px;font-size:11px;font-weight:700;display:inline-block;margin:4px 0}
.btn-blue{width:100%;background:#1E3A8A;color:white;padding:16px;border-radius:14px;border:none;font-weight:800;font-size:16px;margin-top:10px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #E2E8F0;display:flex;justify-content:space-around;padding:10px 0}
.nav-item{text-align:center;font-size:11px;color:#94A3B8} .nav-item.active{color:#16A34A}
</style>
</head>
<body>
<div class="header">
<div class="header-top"><h1>AlertaVia</h1><div>🔔 👤</div></div>
</div>

<div class="main" id="app">
<div class="card">Conectando a V5.4...</div>
</div>

<div class="bottom-nav">
<div class="nav-item active">📍<br>Mapa</div>
<div class="nav-item">🔔<br>Alertas</div>
<div class="nav-item">📋<br>Informes</div>
<div class="nav-item">👤<br>Perfil</div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
firebase.initializeApp({ databaseURL: "https://alertavia-default-rtdb.firebaseio.com" });
firebase.database().ref("alertavia_pro").on("value", snap=>{
  const d = snap.val(); if(!d) return;
  const isVerde = d.color==="verde", isAmarillo=d.color==="amarillo", isRojo=d.color==="rojo";
  const colorBg = isVerde?"#16A34A":isAmarillo?"#EAB308":isRojo?"#DC2626":"#64748B";
  const txtEstado = isVerde?"Ruta despejada • Sin incidentes":isAmarillo?"Precaución • Tráfico lento":isRojo?"Cierre reportado":d.nivel;
  const subEstado = isVerde?"Guarne → Medellín • Tráfico fluido":d.mensaje_pro.substring(0,60);
  
  const climaTemp = d.detalle?.clima?.temp || "--";
  const climaPrec = d.detalle?.clima?.precip_ultima_hora || 0;
  const viento = d.detalle?.clima?.viento || "--";
  const santaMsg = d.detalle?.santa_elena?.mensaje || "Consultando INVIAS...";
  const santaEstado = d.detalle?.santa_elena?.nivel==="fluido"?"Tránsito normal":d.detalle?.santa_elena?.nivel==="lento"?"Tráfico lento":d.detalle?.santa_elena?.nivel==="cerrado"?"Cerrada":"Verificando";
  const tunelMsg = d.detalle?.tunel_oriente?.mensaje || "Consultando Túnel...";
  const tunelEstado = d.detalle?.tunel_oriente?.nivel==="fluido"?"Operando normal":d.detalle?.tunel_oriente?.nivel==="lento"?"Precaución":d.detalle?.tunel_oriente?.nivel==="cerrado"?"Cerrado":"Verificando";

  document.getElementById("app").innerHTML = `
    <div style="border-radius:18px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.1);margin-bottom:14px">
      <div class="green-card" style="background:${colorBg}"><div class="green-dot">✓</div><div><div style="font-weight:700">${txtEstado}</div><div style="font-size:12px;opacity:.9">${subEstado}</div></div></div>
      <div class="card" style="margin:0;border-radius:0 0 18px 18px">
        <div class="clima-row">
          <div><div style="font-weight:700">Guarne</div><div style="font-size:28px;font-weight:800">${climaTemp}°C</div><div style="font-size:12px;color:#64748B">${climaPrec>0?`Lluvia ${climaPrec}mm`:"Nublado parcial"}</div></div>
          <div style="text-align:right"><div style="font-size:36px">${climaPrec>2?"🌧️":"⛅"}</div><div style="font-size:11px;color:#64748B;margin-top:8px">💨 ${viento} km/h | 💧 ${climaPrec}%</div></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center"><b>Ruta activa: Guarne → Medellín</b><span style="background:#DCFCE7;color:#166534;padding:4px 8px;border-radius:10px;font-size:11px;font-weight:700">⏱ 42 min • 30 km</span></div>
      <div class="route-map"><div class="route-line"></div><div class="pin" style="left:10%;top:40%">📍 Guarne</div><div class="pin" style="right:10%;top:45%">📍 Medellín</div></div>
    </div>

    <div class="card via-row">
      <div style="display:flex;gap:12px;align-items:center"><div class="via-icon" style="background:#FEF3C7">⛰️</div><div><b>Santa Elena</b><br><span class="via-badge" style="background:${isVerde?'#DCFCE7':'#FEF9C3'};color:${isVerde?'#166534':'#854D0E'}">${santaEstado}</span><br><span style="font-size:12px;color:#64748B">${santaMsg.substring(0,50)}...</span></div></div><div style="color:#94A3B8">›</div>
    </div>

    <div class="card via-row">
      <div style="display:flex;gap:12px;align-items:center"><div class="via-icon" style="background:#DBEAFE">🚇</div><div><b>Túnel de Oriente</b><br><span class="via-badge" style="background:#DCFCE7;color:#166534">${tunelEstado}</span><br><span style="font-size:12px;color:#64748B">${tunelMsg.substring(0,50)}...</span></div></div><div style="color:#94A3B8">›</div>
    </div>

    <button class="btn-blue" onclick="window.open('https://www.google.com/maps/dir/Guarne,+Antioquia/Medellín,+Antioquia','_blank')">Iniciar navegación ↗</button>
    <div style="text-align:center;font-size:10px;color:#94A3B8;margin-top:10px">Fuentes: ${d.fuentes_verificadas?.join(' • ')} • V5.4 FINAL • ${d.ultima_verificacion}</div>
  `;
});
</script>
</body>
</html>
