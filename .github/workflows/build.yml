name: Build AlertaVia APK PRO
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Prepare Web + Icon
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm install --force
          npm install @capacitor/assets --force
          npx capacitor-assets generate --iconBackgroundColor '#0A0F1E' --iconBackgroundColorDark '#0A0F1E' --splashBackgroundColor '#0A0F1E' || echo "Sin icon.png, usando default"
      - name: Build Android
        run: |
          rm -rf android
          npx cap add android
          npx cap copy android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlertaVia-APK-TUNEL
          path: android/app/build/outputs/apk/debug/app-debug.apk
